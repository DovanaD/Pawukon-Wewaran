<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclos pawukon</title>
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --surface-alt: #f1efe8;
    --text: #2c2c2a;
    --text-mut: #888780;
    --text-faint: #b4b2a9;
    --border: rgba(0,0,0,0.08);
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #262624;
      --surface-alt: #2c2c2a;
      --text: #f1efe8;
      --text-mut: #b4b2a9;
      --text-faint: #5f5e5a;
      --border: rgba(255,255,255,0.1);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px;
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.5;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 10px;
  }
  .day-info { flex: 1; min-width: 0; }
  .day-num { font-size: 22px; font-weight: 500; }
  .day-name { font-size: 13px; color: var(--text-mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .controls { display: flex; gap: 6px; }
  button {
    background: var(--surface);
    color: var(--text);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-family: inherit;
  }
  button:hover { background: var(--surface-alt); }
  button:active { transform: scale(0.96); }
  .action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    align-items: center;
  }
  .action-row input[type=range] {
    flex: 1;
    height: 32px;
    accent-color: var(--text);
  }
  .btn-text {
    width: auto;
    padding: 0 12px;
    height: 32px;
    font-size: 12px;
  }
  .date-input {
    background: var(--surface);
    color: var(--text);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-size: 12px;
    font-family: inherit;
    width: 100%;
    margin-bottom: 20px;
  }
  .anchor-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--text-mut);
    flex-wrap: wrap;
  }
  .anchor-row label { white-space: nowrap; }
  .anchor-row input { flex: 1; min-width: 140px; }
  .wheels { display: flex; flex-direction: column; gap: 14px; }
  .cycle-row-wrap { }
  .cycle-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .cycle-name { font-size: 13px; font-weight: 500; }
  .cycle-len { font-size: 11px; color: var(--text-faint); }
  .cycle-row { display: flex; gap: 4px; flex-wrap: nowrap; }
  .cell {
    flex: 1;
    min-width: 0;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--text-faint);
    background: var(--surface);
    transition: all 0.15s;
  }
  .cell.active {
    font-weight: 500;
    transform: scale(1.08);
    color: white;
    border-color: transparent;
  }
  .footer {
    margin-top: 20px;
    padding: 12px;
    background: var(--surface-alt);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text-mut);
    line-height: 1.6;
  }
  .footer strong { color: var(--text); font-weight: 500; }
  .status {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div class="day-info">
    <div class="day-num" id="day-num">Dia 1</div>
    <div class="day-name" id="day-name"></div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="anterior">‹</button>
    <button id="play" aria-label="play"><span id="play-icon">▶</span></button>
    <button id="next" aria-label="próximo">›</button>
  </div>
</div>

<div class="action-row">
  <input type="range" id="slider" min="1" max="27720" value="1" step="1">
  <button id="today" class="btn-text">hoje</button>
</div>

<div class="anchor-row">
  <label for="anchor">Dia 1 =</label>
  <input type="date" id="anchor" class="date-input" style="margin-bottom: 0;">
</div>

<div class="wheels" id="wheels"></div>

<div class="footer">
  <div><strong>MMC dos ciclos:</strong> <span id="lcm"></span> dias (≈ <span id="years"></span> anos)</div>
  <div style="margin-top: 4px;">Ciclos 1–10 são o wewaran balinês. O ciclo de 11 é adicional.</div>
  <div class="status" id="status">Estado salvo automaticamente</div>
</div>

<script>
(function() {
  const cycles = [
    { n: 1,  name: 'ekawara',   names: ['luang'] },
    { n: 2,  name: 'dwiwara',   names: ['menga','pepet'] },
    { n: 3,  name: 'triwara',   names: ['pasah','beteng','kajeng'] },
    { n: 4,  name: 'caturwara', names: ['sri','laba','jaya','menala'] },
    { n: 5,  name: 'pancawara', names: ['umanis','paing','pon','wage','kliwon'] },
    { n: 6,  name: 'sadwara',   names: ['tungleh','aryang','urukung','paniron','was','maulu'] },
    { n: 7,  name: 'saptawara', names: ['redite','soma','anggara','buda','wraspati','sukra','saniscara'] },
    { n: 8,  name: 'astawara',  names: ['sri','indra','guru','yama','ludra','brahma','kala','uma'] },
    { n: 9,  name: 'sangawara', names: ['dangu','jangur','gigis','nohan','ogan','erangan','urungan','tulus','dadi'] },
    { n: 10, name: 'dasawara',  names: ['pandita','pati','suka','duka','sri','manuh','manusa','raja','dewa','raksasa'] },
    { n: 11, name: 'ciclo-11',  names: Array.from({length:11}, (_,i) => 'd'+(i+1)) }
  ];

  const colors = ['#888780','#378ADD','#1D9E75','#7F77DD','#D85A30','#D4537E','#EF9F27','#639922','#E24B4A','#378ADD','#7F77DD'];
  const STORAGE_KEY = 'pawukon-ciclos-v1';

  function gcd(a,b){ return b ? gcd(b, a%b) : a; }
  function lcm(a,b){ return a*b/gcd(a,b); }
  const totalLcm = cycles.reduce((a,c) => lcm(a, c.n), 1);

  const wheelsEl = document.getElementById('wheels');
  const dayNumEl = document.getElementById('day-num');
  const dayNameEl = document.getElementById('day-name');
  const slider = document.getElementById('slider');
  const anchorEl = document.getElementById('anchor');
  const statusEl = document.getElementById('status');
  document.getElementById('lcm').textContent = totalLcm.toLocaleString('pt-BR');
  document.getElementById('years').textContent = (totalLcm / 365.25).toFixed(1);
  slider.max = totalLcm;

  // Load state
  let state = { anchorDate: null };
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = JSON.parse(saved);
  } catch(e) {}

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      statusEl.textContent = 'Salvo · ' + new Date().toLocaleTimeString('pt-BR');
    } catch(e) {
      statusEl.textContent = 'Erro ao salvar';
    }
  }

  // Build cycle rows
  cycles.forEach((cyc, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'cycle-row-wrap';
    wrap.innerHTML = `
      <div class="cycle-header">
        <span class="cycle-name">${cyc.name}</span>
        <span class="cycle-len">${cyc.n} dias</span>
      </div>
      <div class="cycle-row" data-cycle="${idx}"></div>
    `;
    wheelsEl.appendChild(wrap);
    const row = wrap.querySelector('.cycle-row');
    for (let i = 0; i < cyc.n; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = i + 1;
      row.appendChild(cell);
    }
  });

  function daysSinceAnchor() {
    if (!state.anchorDate) return 1;
    const anchor = new Date(state.anchorDate + 'T00:00:00');
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffMs = today - anchor;
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
    return diffDays;
  }

  function computeToday() {
    const d = daysSinceAnchor();
    return ((d - 1) % totalLcm + totalLcm) % totalLcm + 1;
  }

  function update(day) {
    const d = ((day - 1) % totalLcm + totalLcm) % totalLcm;
    dayNumEl.textContent = 'Dia ' + day.toLocaleString('pt-BR');
    const names = [];
    document.querySelectorAll('.cycle-row').forEach((row, idx) => {
      const cyc = cycles[idx];
      const pos = d % cyc.n;
      const color = colors[idx];
      row.querySelectorAll('.cell').forEach((cell, i) => {
        if (i === pos) {
          cell.classList.add('active');
          cell.style.background = color;
        } else {
          cell.classList.remove('active');
          cell.style.background = '';
        }
      });
      if (cyc.n > 1) names.push(cyc.names[pos]);
    });
    dayNameEl.textContent = names.slice(0, 5).join(' · ');
  }

  let current = 1;
  function setDay(d, save = false) {
    current = Math.max(1, Math.min(totalLcm, d));
    slider.value = current;
    update(current);
  }

  function goToToday() {
    if (!state.anchorDate) {
      // Default anchor to today
      const today = new Date();
      state.anchorDate = today.toISOString().slice(0,10);
      anchorEl.value = state.anchorDate;
      saveState();
    }
    setDay(computeToday());
  }

  slider.addEventListener('input', e => setDay(parseInt(e.target.value)));
  document.getElementById('prev').addEventListener('click', () => setDay(current - 1));
  document.getElementById('next').addEventListener('click', () => setDay(current + 1));
  document.getElementById('today').addEventListener('click', goToToday);

  anchorEl.addEventListener('change', e => {
    state.anchorDate = e.target.value || null;
    saveState();
    if (state.anchorDate) setDay(computeToday());
  });

  let playing = null;
  document.getElementById('play').addEventListener('click', () => {
    const icon = document.getElementById('play-icon');
    if (playing) {
      clearInterval(playing);
      playing = null;
      icon.textContent = '▶';
    } else {
      playing = setInterval(() => setDay(current + 1), 350);
      icon.textContent = '⏸';
    }
  });

  // Init
  if (state.anchorDate) {
    anchorEl.value = state.anchorDate;
    setDay(computeToday());
  } else {
    setDay(1);
  }
})();
</script>

</body>
</html>
